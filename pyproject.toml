[project]
name = "taskforce"
version = "0.1.0"
description = "TaskForce -- 基于 LangGraph 的个人 Agent 工作台:知识库问答、联网调研、沙箱代码执行"
requires-python = ">=3.12,<3.13"
dependencies = [

    "pyyaml>=6.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=1.3.18",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.0.0",
    "rich>=15.0.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent",
    "src/tools",
    "src/prompts",
    "src/settings",
    "src/api",
    "src/cli",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# CLI/API 入口需要先 reconfigure stdout 为 UTF-8(Windows GBK 坑),import 因此被推迟
"src/cli/*.py" = ["E402"]
"src/api/*.py" = ["E402", "B008"]  # B008:FastAPI 惯用 `= File(...)` 参数默认值,非缺陷
"src/tools/rag/cli.py" = ["E402"]
